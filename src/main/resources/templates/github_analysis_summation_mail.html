<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis Report</title>
</head>
<body>
<div class="container" style="width: 80%; max-width: 750px; margin: 20px auto 40px; padding: 20px; background-color: #fff; box-sizing: border-box;">
    <p>안녕하세요. <span th:text="${nickname}">에이블제이님.</span>님.</p>
    <p>
        <a
                target="_blank"
                href="https://noteme.kro.kr/"
                style="color: #333; text-decoration: none; font-weight: 700;"
        >AI Headhunting</a>
        사이트에서 AI를 기반으로 분석한 귀하의 GitHub 프로젝트 결과를
        보내드립니다.
    </p>
    <div class="header" style="text-align: center; border-top: 3.5px solid #333; padding: 48px 0 32px; margin: 50px 0 12px;">
        <h1 style="font-size: 24px; color: #333; margin: 0;">
            [AHEY] <span th:text="${projectName}">OWNER/REPOSITORY</span>
            분석 레포트
        </h1>
    </div>
    <div class="content" style="font-size: 15px; line-height: 1.65; color: #333; margin-bottom: 20px;">
        <h3>프로젝트 요약</h3>
        <p th:text="${summation}">
            프로젝트 설명
        </p>

        <h3 style="margin: 40px 0 16px;">사용 기술</h3>
        <ul>
            <li th:each="tech : ${techSkills}">
                <strong th:text="${tech.skill}">기술 이름</strong>:
                 <span th:text="${tech.description}">기술 설명
                </span>
            </li>
        </ul>
        <h3 style="margin: 40px 0 16px;">핵심 기능 및 프로젝트 강점</h3>
        <ul>
            <li th:each="item : ${keyFeatures}">
                <strong th:text="${item.feature}">기능 이름</strong>:
                 <span th:text="${item.description}">기능 설명</span>
            </li>
        </ul>
    </div>
    <div class="footer" style="font-size: 13.5px; color: #777; text-align: left; padding-top: 20px; margin-top: 60px; border-top: 2px solid #333;">
        <p>이 보고서에 대한 질문이 있으시면 언제든지 연락 주시기 바랍니다.</p>
        <a
                href="https://noteme.kro.kr/"
                target="_blank"
                style="
            display: block;
            color: #333;
            background-color: #f7f7f7;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            margin-top: 16px;
            text-decoration: none;
            font-size: 14px;
          "
        >https://noteme.kro.kr/</a>
    </div>
    <div
            style="
          color: #777;
          font-size: 14.5px;
          padding: 28px 0;
          text-align: left;
        "
    ></div>
</div>
</body>
</html>
