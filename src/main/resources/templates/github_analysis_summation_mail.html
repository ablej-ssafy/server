<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            color: #007bff;
        }
        h2 {
            font-size: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .content {
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
    <title>GitHub Repository Analysis Summary</title>
</head>
<body>
<div class="container">
    <h1>GitHub 프로젝트 분석 결과</h1>
    <h2 th:text="'프로젝트: ' + ${subject}"></h2>
    <div class="content">
        <p th:utext="${analysisSummary}"></p>
    </div>
    <div class="footer">
        <p>이 메일은 자동으로 생성된 것입니다. 답장을 보내지 마세요.</p>
        <p>더 많은 정보가 필요하시다면, 지원팀에 문의해 주세요.</p>
    </div>
</div>
</body>
</html>
