spring:
  application:
    name: server

  profiles:
    include: secret

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            authorization-grant-type: authorization_code
            redirect-uri: ${app.server-base-url}/oauth2/code/google
            scope:
              - email
              - profile
          kakao:
            client-name: kakao
            redirect-uri: ${app.server-base-url}/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_image
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account

sentry:
  dsn: ${sentry_dsn}
  traces-sample-rate: 1.0
  exception-resolver-order: -2147483647
  environment: development # 개발시
#  environment: production # 배포시