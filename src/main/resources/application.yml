spring:
  application:
    name: server

  profiles:
    include: secret

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            authorization-grant-type: authorization_code
            redirect-uri: ${app.server-base-url}/login/oauth2/code/google
            scope:
              - email
              - profile
          kakao:
            client-name: kakao
            redirect-uri: ${app.server-base-url}/login/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - account_email
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account