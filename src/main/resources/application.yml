spring:
  application:
    name: server

  profiles:
    include: secret

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            authorization-grant-type: authorization_code
            redirect-uri: ${app.server-base-url}/oauth2/code/google
            scope:
              - email
              - profile
          kakao:
            client-name: kakao
            redirect-uri: ${app.server-base-url}/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_image
              - profile_nickname
              - account_email
              - gender
              - age_range
              - birthday
          github:
            redirect-uri: ${app.server-base-url}/api/v1/github/callback
            authorization-grant-type: authorization_code
            scope: read:user, repo
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${app.gmail-account}
    password: ${app.gmail-key}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 50000
          starttls:
            enable: true

  thymeleaf:
    check-template-location: true
    suffix: .html
    mode: HTML5
    cache: false
    template-resolver-order: 0

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

sentry:
  dsn: ${sentry_dsn}
  traces-sample-rate: 1.0
  exception-resolver-order: -2147483647
  environment: development # 개발시

logging:
  level:
    me.noteme: DEBUG

  servlet:
    multipart:
      max-file-size: 10MB