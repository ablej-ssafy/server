spring:
  application:
    name: server

  profiles:
    include: secret

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            authorization-grant-type: authorization_code
            redirect-uri: ${app.server-base-url}/oauth2/code/google
            scope:
              - email
              - profile
          kakao:
            client-name: kakao
            redirect-uri: ${app.server-base-url}/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_image
              - profile_nickname
              - account_email
              - gender
              - age_range
              - birthday
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${app.gmail-account}
    password: ${app.gmail-key}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 50000
          starttls:
            enable: true

  thymeleaf:
    check-template-location: true
    suffix: .html
    mode: HTML5
    cache: false
    template-resolver-order: 0

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

sentry:
  dsn: ${sentry_dsn}
  traces-sample-rate: 1.0
  exception-resolver-order: -2147483647
  environment: development # 개발시

logging:
  level:
    me.noteme: DEBUG

  servlet:
    multipart:
      max-file-size: 10MB

# Mattermost 설정
notification:
  mattermost:
    # TODO: 추후 배포 환경에서만 true 해주어야합니다.
    enabled: true  # mmSender를 사용할 지 여부, false면 알림이 오지 않는다
    webhook-url: https://meeting.ssafy.com/hooks/89k6cs8ak78mdxn1yh363ckemr  # 위의 Webhook URL을 기입
    channel:   # 기본 설정한 채널이 아닌 다른 채널로 보내고 싶을 때 기입한다
    pretext: ""  # attachments의 상단에 나오게 되는 일반 텍스트 문자
    color: ""  # attachment에 왼쪽 사이드 컬러. default=red
    author-name: ""  # attachment의 상단에 나오는 이름
    author-icon: ""  # author-icon 왼쪽에 나올 아이콘의 url링크
    footer: ""  # attachment에 하단에 나올 부분. default=현재 시간